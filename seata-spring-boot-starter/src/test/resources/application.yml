# Seata 配置 - 使用MySQL数据库
seata:
  enabled: true
  application-id: seata-test
  tx-service-group: my_test_tx_group
  service:
    vgroup-mapping:
      my_test_tx_group: default
    grouplist:
      default: 127.0.0.1:8091
  config:
    type: file
  registry:
    type: file
  data-source-proxy-mode: AT

